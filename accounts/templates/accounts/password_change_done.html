{% extends 'base.html' %}

{% block title %}Password Changed | MediCare{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8 text-center my-5">
            <div class="card border-0 shadow-sm rounded-4 p-5 bg-white">
                <i class="bi bi-shield-check-fill text-success display-1 mb-3"></i>
                <h2 class="fw-bold font-outfit text-dark">Password Updated</h2>
                <p class="text-secondary mb-4">Your account password has been changed successfully. You can now use your new password for future log ins.</p>
                <div class="d-grid gap-2 col-md-8 mx-auto">
                    <a href="{% url 'accounts:dashboard' %}" class="btn btn-primary rounded-pill py-2 shadow-sm fw-semibold">Go to Dashboard</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
