{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Reset Password | MediCare{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="card border-0 shadow-sm rounded-4 bg-white">
                <div class="card-header bg-white border-0 pt-4 px-4 pb-0">
                    <h3 class="fw-bold font-outfit text-dark mb-1">Reset Password</h3>
                    <p class="text-muted small">Enter your email address and we will email you instructions to reset your password.</p>
                </div>
                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-semibold shadow-sm">Send Reset Email</button>
                        </div>
                    </form>
                    <hr class="my-4">
                    <div class="text-center">
                        <a href="{% url 'accounts:login' %}" class="small fw-semibold text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Back to Sign In</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
