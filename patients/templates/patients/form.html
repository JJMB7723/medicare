{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Edit Patient File | MediCare{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm rounded-4 bg-white p-4">
                <div class="mb-4">
                    <h3 class="fw-bold font-outfit text-dark mb-1">Modify Patient File</h3>
                    <p class="text-muted small">Update medical record details for the selected patient.</p>
                </div>
                <form method="post" class="needs-validation" novalidate>
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="mt-4 d-flex gap-2">
                        <button type="submit" class="btn btn-primary rounded-pill px-4 py-2 fw-semibold">Save Changes</button>
                        <a href="{% url 'patients:list' %}" class="btn btn-light rounded-pill px-4 py-2">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
