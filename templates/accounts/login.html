{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Login | MediCare Hospital Management System{% endblock %}

{% block content %}
<section class="py-5 d-flex align-items-center" style="min-height: calc(100vh - 200px); background-color: #f1f5f9;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div class="bg-primary text-white text-center py-4 px-3">
                        <i class="bi bi-shield-lock-fill fs-1"></i>
                        <h3 class="mt-2 text-white">MediCare Portal</h3>
                        <p class="mb-0 small text-white-50">Sign in to access your medical records or dashboard</p>
                    </div>
                    <div class="card-body p-4 p-md-5">
                        <form method="post" novalidate>
                            {% csrf_token %}
                            {{ form|crispy }}
                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-primary-custom btn-lg rounded-pill py-2">
                                    <i class="bi bi-box-arrow-in-right"></i> Sign In
                                </button>
                            </div>
                        </form>
                        <hr class="my-4">
                        <div class="text-center">
                            <span class="text-muted small">New patient?</span>
                            <a href="{% url 'patient_register' %}" class="small fw-semibold text-decoration-none text-primary ms-1">Register Online</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
