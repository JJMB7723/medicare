{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Change Password | MediCare Hospital Management System{% endblock %}

{% block content %}
<section class="py-5 bg-light" style="min-height: calc(100vh - 200px);">
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card border-0 shadow-md rounded-3">
                    <div class="card-header bg-white border-bottom py-3">
                        <h4 class="mb-0"><i class="bi bi-key-fill text-primary"></i> Change Password</h4>
                    </div>
                    <div class="card-body p-4">
                        <form method="post" novalidate>
                            {% csrf_token %}
                            {{ form|crispy }}
                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-primary-custom rounded-pill py-2">Update Password</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
