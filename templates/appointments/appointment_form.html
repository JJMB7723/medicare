{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Book Consultation Slot | MediCare Hospital{% endblock %}

{% block content %}
<section class="py-5 bg-light" style="min-height: calc(100vh - 200px);">
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card border-0 shadow-md rounded-3">
                    <div class="card-header bg-white border-bottom py-3">
                        <h4 class="mb-0"><i class="bi bi-calendar-plus text-primary"></i> Book Appointment Slot</h4>
                    </div>
                    <div class="card-body p-4">
                        <form method="post" id="appointmentForm" novalidate>
                            {% csrf_token %}
                            
                            <!-- Display Patient selection dropdown for Admin & Receptionists -->
                            {% if patients %}
                                <div class="mb-3">
                                    <label class="form-label fw-bold" for="patient_select"><i class="bi bi-person-circle"></i> Assign to Patient</label>
                                    <select name="patient_id" id="patient_select" class="form-select" required>
                                        <option value="">-- Choose Patient Profile --</option>
                                        {% for pat in patients %}
                                            <option value="{{ pat.id }}">{{ pat.patient_name }} (Age: {{ pat.patient_age }})</option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <hr>
                            {% endif %}
                            
                            {{ form|crispy }}
                            
                            <div class="d-flex justify-content-between mt-4">
                                <a href="{% url 'appointment_list' %}" class="btn btn-outline-secondary px-4 rounded-pill">Cancel</a>
                                <button type="submit" class="btn btn-primary-custom px-4 rounded-pill">Book Appointment</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
