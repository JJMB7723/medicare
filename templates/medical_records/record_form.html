{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Add Medical Record | MediCare Hospital{% endblock %}

{% block content %}
<section class="py-5 bg-light" style="min-height: calc(100vh - 200px);">
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-10 col-lg-8">
                <div class="card border-0 shadow-md rounded-3">
                    <div class="card-header bg-white border-bottom py-3">
                        <h4 class="mb-0"><i class="bi bi-file-earmark-medical-fill text-primary"></i> Add Medical Record for {{ patient.patient_name }}</h4>
                    </div>
                    <div class="card-body p-4">
                        <form method="post" enctype="multipart/form-data" novalidate>
                            {% csrf_token %}
                            {{ form|crispy }}
                            <div class="d-flex justify-content-between mt-4">
                                <a href="{% url 'patient_detail' patient.id %}" class="btn btn-outline-secondary px-4 rounded-pill">Cancel</a>
                                <button type="submit" class="btn btn-primary-custom px-4 rounded-pill">Save Medical Record</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
